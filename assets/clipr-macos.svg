<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824×824 rounded square centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86f8"/>
      <stop offset="1" stop-color="#0a55cc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- clipboard board -->
  <rect x="318" y="268" width="388" height="488" rx="52" fill="#ffffff"/>
  <!-- clip -->
  <rect x="412" y="222" width="200" height="100" rx="34" fill="#dbe7fb" stroke="#0a55cc" stroke-width="20"/>
  <!-- history lines -->
  <rect x="384" y="408" width="256" height="40" rx="20" fill="#2f7df6"/>
  <rect x="384" y="502" width="200" height="40" rx="20" fill="#9dbdf2"/>
  <rect x="384" y="596" width="228" height="40" rx="20" fill="#9dbdf2"/>
</svg>
