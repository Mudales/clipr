name: release

# Push a tag like v0.1.0 to build and publish prebuilt binaries for install.sh.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      # Signs with the stable clipr-dev certificate (secrets MACOS_CERT_P12,
      # MACOS_CERT_PASSWORD), so macOS keeps the Accessibility permission
      # across updates. The runner is thrown away afterwards.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "no certificate secret: ad-hoc signing"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"
          KPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # codesign only uses certificates trusted for code signing.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain assets/clipr-signing.pem
          security find-identity -v -p codesigning "$KC"
          echo "CLIPR_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Universal clipr.app
        run: |
          mkdir -p dist
          lipo -create -output dist/clipr \
            target/aarch64-apple-darwin/release/clipr \
            target/x86_64-apple-darwin/release/clipr
          scripts/bundle-macos.sh dist/clipr dist "${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/clipr.app clipr-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: clipr-macos-universal.zip

  linux:
    # Oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: tar -czf clipr-linux-x86_64.tar.gz -C target/release clipr
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: clipr-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: cargo test --release
      - name: Check the exe needs no Visual C++ runtime DLL
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target/release/clipr.exe
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw 'clipr.exe depends on the VC++ runtime' }
      - run: Compress-Archive -Path target/release/clipr.exe -DestinationPath clipr-windows-x86_64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: clipr-windows-x86_64.zip

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            clipr-macos-universal.zip clipr-linux-x86_64.tar.gz clipr-windows-x86_64.zip
