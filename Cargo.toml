[package]
name = "clipr"
version = "0.8.4"
edition = "2024"
license = "MIT"

[features]
default = ["bundled-sqlite"]
# Compile SQLite in (no system library needed). Disable to use the system's libsqlite3.
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nucleo-matcher = "0.3.1"
regex-lite = "0.1.9"
rusqlite = "0.40.2"
unicode-bidi = "0.3.18"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
global-hotkey = "0.8.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
wl-clipboard-rs = "0.9"

[target."cfg(windows)".dependencies]
global-hotkey = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
